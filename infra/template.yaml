AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FoodHub - API Gateway (HTTP API) + Lambda (restaurants & menus CRUD),
  authenticated with an existing Cognito User Pool, backed by MongoDB Atlas.

Parameters:
  ExistingUserPoolId:
    Type: String
    Description: ID of the already-provisioned Cognito User Pool (region us-east-2).
    Default: us-east-2_p38HjKWPB
  ExistingUserPoolClientId:
    Type: String
    Description: App Client ID of the already-provisioned Cognito User Pool.
  AllowedWebOrigin:
    Type: String
    Description: Production frontend origin (Vercel URL) allowed by CORS, in addition to localhost:3000.
    Default: http://localhost:3000

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        MONGODB_URI_PARAM: /foodhub/mongodb-uri
        MONGODB_DB_NAME: foodhub_local

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedWebOrigin
          - http://localhost:3002
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}
              audience:
                - !Ref ExistingUserPoolClientId
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  RestaurantsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/restaurants/index.ts
        Minify: true
        Target: es2020
    Properties:
      CodeUri: .
      Handler: src/lambda/restaurants/index.handler
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: foodhub/mongodb-uri
      Events:
        ListRestaurants:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants
            Method: get
        CreateRestaurant:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants
            Method: post
        GetRestaurant:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}
            Method: get
        UpdateRestaurant:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}
            Method: put
        DeleteRestaurant:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}
            Method: delete

  PagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/pages/index.ts
        Minify: true
        Target: es2020
    Properties:
      CodeUri: .
      Handler: src/lambda/pages/index.handler
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: foodhub/mongodb-uri
      Events:
        ListPages:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}/pages
            Method: get
        CreatePage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}/pages
            Method: post
        GetPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pages/{pageId}
            Method: get
        UpdatePage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pages/{pageId}
            Method: put
        DeletePage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pages/{pageId}
            Method: delete

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub foodhub-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
        BlockPublicAcls: true
        IgnorePublicAcls: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET]

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImagesBucket}/public/*

  ImagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/images/index.ts
        Minify: true
        Target: es2020
    Properties:
      CodeUri: .
      Handler: src/lambda/images/index.handler
      MemorySize: 512
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        UploadImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /images
            Method: post

  MenusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/menus/index.ts
        Minify: true
        Target: es2020
    Properties:
      CodeUri: .
      Handler: src/lambda/menus/index.handler
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: foodhub/mongodb-uri
      Events:
        ListMenus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}/menus
            Method: get
        CreateMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /restaurants/{id}/menus
            Method: post
        GetMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /menus/{menuId}
            Method: get
        UpdateMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /menus/{menuId}
            Method: put
        DeleteMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /menus/{menuId}
            Method: delete

Outputs:
  UserPoolId:
    Value: !Ref ExistingUserPoolId
  UserPoolClientId:
    Value: !Ref ExistingUserPoolClientId
  HttpApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ImagesBucketName:
    Value: !Ref ImagesBucket
  ImagesBucketUrl:
    Value: !Sub "https://${ImagesBucket}.s3.${AWS::Region}.amazonaws.com"
